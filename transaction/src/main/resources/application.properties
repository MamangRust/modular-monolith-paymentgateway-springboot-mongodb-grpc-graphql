spring.application.name=transaction-service
spring.data.mongodb.uri=mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB_NAME:example_mongo_payment_gateway}
spring.data.mongodb.auto-index-creation=true

# gRPC server
grpc.server.port=9009

# gRPC clients (downstream domain services)
grpc.client.merchant.host=${MERCHANT_GRPC_HOST:localhost}
grpc.client.merchant.port=${MERCHANT_GRPC_PORT:9005}
grpc.client.saldo.host=${SALDO_GRPC_HOST:localhost}
grpc.client.saldo.port=${SALDO_GRPC_PORT:9007}
grpc.client.card.host=${CARD_GRPC_HOST:localhost}
grpc.client.card.port=${CARD_GRPC_PORT:9004}

# JWT
springjwt.app.jwtSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c31
springjwt.app.jwtRefreshSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c32
springjwt.app.jwtExpirationMs=86400000
springjwt.app.jwtRefreshExpirationMs=86400000
