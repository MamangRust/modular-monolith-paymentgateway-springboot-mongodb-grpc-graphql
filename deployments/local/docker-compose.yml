services:
  mongo:
    image: mongo:7.0
    container_name: mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: example_mongo_payment_gateway
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    healthcheck:
      # Self-initialising single-node replica set. Spring Data MongoDB
      # transactions (used by the transactional outbox) require a replSet.
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb-exporter:
    image: mongodb/mongodb-exporter:latest
    container_name: mongodb_exporter
    restart: unless-stopped
    command:
      - "--mongodb.uri=mongodb://mongo:27017"
      - "--collect.all"
    ports:
      - "9216:9216"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app_network

  pyroscope:
    image: grafana/pyroscope:latest
    ports:
      - 4040:4040
    networks:
      - app_network

  redis-node-1:
    image: redis:7.4
    container_name: redis_node_1
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass dragon_knight --masterauth dragon_knight
    ports:
      - "6379:6379"
    volumes:
      - redis_node_1_data:/data
    networks:
      - app_network

  redis-node-2:
    image: redis:7.4
    container_name: redis_node_2
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass dragon_knight --masterauth dragon_knight
    ports:
      - "6380:6379"
    volumes:
      - redis_node_2_data:/data
    networks:
      - app_network

  redis-node-3:
    image: redis:7.4
    container_name: redis_node_3
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass dragon_knight --masterauth dragon_knight
    ports:
      - "6381:6379"
    volumes:
      - redis_node_3_data:/data
    networks:
      - app_network

  redis-node-4:
    image: redis:7.4
    container_name: redis_node_4
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass dragon_knight --masterauth dragon_knight
    ports:
      - "6382:6379"
    volumes:
      - redis_node_4_data:/data
    networks:
      - app_network

  redis-node-5:
    image: redis:7.4
    container_name: redis_node_5
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass dragon_knight --masterauth dragon_knight
    ports:
      - "6383:6379"
    volumes:
      - redis_node_5_data:/data
    networks:
      - app_network

  redis-node-6:
    image: redis:7.4
    container_name: redis_node_6
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass dragon_knight --masterauth dragon_knight
    ports:
      - "6384:6379"
    volumes:
      - redis_node_6_data:/data
    networks:
      - app_network

  redis-cluster-init:
    image: redis:7.4
    container_name: redis_cluster_init
    command: >
      sh -c "sleep 5 &&
      if redis-cli -h redis-node-1 -a dragon_knight --no-auth-warning cluster info 2>/dev/null | grep -q 'cluster_state:ok'; then
        echo 'Redis cluster already initialized';
        exit 0;
      fi;
      echo 'yes' | redis-cli -a dragon_knight --cluster create
      redis-node-1:6379
      redis-node-2:6379
      redis-node-3:6379
      redis-node-4:6379
      redis-node-5:6379
      redis-node-6:6379
      --cluster-replicas 1"
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
      - redis-node-6
    networks:
      - app_network

  node-exporter:
    image: quay.io/prometheus/node-exporter
    container_name: node-exporter
    pid: "host"
    networks:
      - app_network
    volumes:
      - "/:/host:ro,rslave"
    command:
      - "--path.rootfs=/host"

  kafka:
    image: apache/kafka:latest
    container_name: my-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_ADVERTISED_HOST:-kafka}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_CLUSTER_ID: kraft-cluster-01
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    volumes:
      - ../../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "9093:9093"
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/rules:/etc/prometheus/rules
    networks:
      - app_network
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - ../../observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - app_network
    depends_on:
      - prometheus
      - jaeger
      - alertmanager
      - loki

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
    networks:
      - app_network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../../observability/otel-collector.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
      - "8889:8889"
    depends_on:
      - jaeger
    networks:
      - app_network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger
    ports:
      - "16686:16686"
      - "14250:14250"
    networks:
      - app_network
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    ports:
      - "9308:9308"
    networks:
      - app_network
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - "--kafka.server=my-kafka:9092"
      - "--web.listen-address=0.0.0.0:9308"
      - "--log.level=debug"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:9308/metrics || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  loki:
    container_name: loki
    image: grafana/loki:3.5.8
    ports:
      - "3100:3100"
    volumes:
      - ../../observability/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app_network

  db-migration:
    build:
      context: ../..
      dockerfile: db-migration/Dockerfile
    image: springboot-payment-gateway/db-migration:latest
    container_name: db-migration
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ../../chaos.yaml:/app/chaos.yaml:ro
    networks:
      - app_network
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - DB_MIGRATE_HOST=mongo
      - DB_MIGRATE_PORT=27017
      - DB_MIGRATE_NAME=example_mongo_payment_gateway

  gateway:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    image: springboot-payment-gateway/gateway:latest
    container_name: gateway
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ../../chaos.yaml:/app/chaos.yaml:ro
    ports:
      - "5000:5000"
    networks:
      - app_network
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
      auth:
        condition: service_started
      card:
        condition: service_started
      merchant:
        condition: service_started
      user:
        condition: service_started
      role:
        condition: service_started
      saldo:
        condition: service_started
      topup:
        condition: service_started
      transaction:
        condition: service_started
      transfer:
        condition: service_started
      withdraw:
        condition: service_started
    environment:
      - REDIS_HOST=${REDIS_HOST_GATEWAY:-redis-node-1}
      - REDIS_PORT=${REDIS_PORT_GATEWAY:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD_GATEWAY:-dragon_knight}
      - REDIS_CLUSTER_ENABLED=${REDIS_CLUSTER_ENABLED:-true}
      - REDIS_CLUSTER_ENDPOINTS=${REDIS_CLUSTER_ENDPOINTS:-redis-node-1:6379,redis-node-2:6379,redis-node-3:6379,redis-node-4:6379,redis-node-5:6379,redis-node-6:6379}
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - HTTP_PORT=5000

  auth:
    build:
      context: ../..
      dockerfile: auth/Dockerfile
    image: springboot-payment-gateway/auth:latest
    container_name: auth
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ../../chaos.yaml:/app/chaos.yaml:ro
    networks:
      - app_network
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis-cluster-init:
        condition: service_completed_successfully
      db-migration:
        condition: service_completed_successfully
    environment:
      - REDIS_HOST=${REDIS_HOST_AUTH:-redis-node-1}
      - REDIS_PORT=${REDIS_PORT_AUTH:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD_AUTH:-dragon_knight}
      - REDIS_CLUSTER_ENABLED=${REDIS_CLUSTER_ENABLED:-true}
      - REDIS_CLUSTER_ENDPOINTS=${REDIS_CLUSTER_ENDPOINTS:-redis-node-1:6379,redis-node-2:6379,redis-node-3:6379,redis-node-4:6379,redis-node-5:6379,redis-node-6:6379}
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - USER_SERVICE_HOST=${USER_GRPC_HOST:-user}
      - USER_SERVICE_PORT=${USER_GRPC_PORT:-9011}
      - ROLE_SERVICE_HOST=${ROLE_GRPC_HOST:-role}
      - ROLE_SERVICE_PORT=${ROLE_GRPC_PORT:-9006}
      - GRPC_SERVER_PORT=${GRPC_AUTH_PORT:-9012}
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB_NAME=example_mongo_payment_gateway

  merchant:
    build:
      context: ../..
      dockerfile: merchant/Dockerfile
    image: springboot-payment-gateway/merchant:latest
    container_name: merchant
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ../../chaos.yaml:/app/chaos.yaml:ro
    networks:
      - app_network
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis-cluster-init:
        condition: service_completed_successfully
      db-migration:
        condition: service_completed_successfully
    environment:
      - REDIS_HOST=${REDIS_HOST_MERCHANT:-redis-node-1}
      - REDIS_PORT=${REDIS_PORT_MERCHANT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD_MERCHANT:-dragon_knight}
      - REDIS_CLUSTER_ENABLED=${REDIS_CLUSTER_ENABLED:-true}
      - REDIS_CLUSTER_ENDPOINTS=${REDIS_CLUSTER_ENDPOINTS:-redis-node-1:6379,redis-node-2:6379,redis-node-3:6379,redis-node-4:6379,redis-node-5:6379,redis-node-6:6379}
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GRPC_SERVER_PORT=${GRPC_MERCHANT_PORT:-9005}
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB_NAME=example_mongo_payment_gateway

  card:
    build:
      context: ../..
      dockerfile: card/Dockerfile
    image: springboot-payment-gateway/card:latest
    container_name: card
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ../../chaos.yaml:/app/chaos.yaml:ro
    networks:
      - app_network
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis-cluster-init:
        condition: service_completed_successfully
      db-migration:
        condition: service_completed_successfully
    environment:
      - REDIS_HOST=${REDIS_HOST_CARD:-redis-node-1}
      - REDIS_PORT=${REDIS_PORT_CARD:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD_CARD:-dragon_knight}
      - REDIS_CLUSTER_ENABLED=${REDIS_CLUSTER_ENABLED:-true}
      - REDIS_CLUSTER_ENDPOINTS=${REDIS_CLUSTER_ENDPOINTS:-redis-node-1:6379,redis-node-2:6379,redis-node-3:6379,redis-node-4:6379,redis-node-5:6379,redis-node-6:6379}
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GRPC_SERVER_PORT=${GRPC_CARD_PORT:-9004}
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB_NAME=example_mongo_payment_gateway

  saldo:
    build:
      context: ../..
      dockerfile: saldo/Dockerfile
    image: springboot-payment-gateway/saldo:latest
    container_name: saldo
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ../../chaos.yaml:/app/chaos.yaml:ro
    networks:
      - app_network
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis-cluster-init:
        condition: service_completed_successfully
      db-migration:
        condition: service_completed_successfully
    environment:
      - REDIS_HOST=${REDIS_HOST_SALDO:-redis-node-1}
      - REDIS_PORT=${REDIS_PORT_SALDO:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD_SALDO:-dragon_knight}
      - REDIS_CLUSTER_ENABLED=${REDIS_CLUSTER_ENABLED:-true}
      - REDIS_CLUSTER_ENDPOINTS=${REDIS_CLUSTER_ENDPOINTS:-redis-node-1:6379,redis-node-2:6379,redis-node-3:6379,redis-node-4:6379,redis-node-5:6379,redis-node-6:6379}
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GRPC_SERVER_PORT=${GRPC_SALDO_PORT:-9007}
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB_NAME=example_mongo_payment_gateway

  role:
    build:
      context: ../..
      dockerfile: role/Dockerfile
    image: springboot-payment-gateway/role:latest
    container_name: role
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ../../chaos.yaml:/app/chaos.yaml:ro
    networks:
      - app_network
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis-cluster-init:
        condition: service_completed_successfully
      db-migration:
        condition: service_completed_successfully
    environment:
      - REDIS_HOST=${REDIS_HOST_ROLE:-redis-node-1}
      - REDIS_PORT=${REDIS_PORT_ROLE:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD_ROLE:-dragon_knight}
      - REDIS_CLUSTER_ENABLED=${REDIS_CLUSTER_ENABLED:-true}
      - REDIS_CLUSTER_ENDPOINTS=${REDIS_CLUSTER_ENDPOINTS:-redis-node-1:6379,redis-node-2:6379,redis-node-3:6379,redis-node-4:6379,redis-node-5:6379,redis-node-6:6379}
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GRPC_SERVER_PORT=${GRPC_ROLE_PORT:-9006}
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB_NAME=example_mongo_payment_gateway

  topup:
    build:
      context: ../..
      dockerfile: topup/Dockerfile
    image: springboot-payment-gateway/topup:latest
    container_name: topup
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ../../chaos.yaml:/app/chaos.yaml:ro
    networks:
      - app_network
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis-cluster-init:
        condition: service_completed_successfully
      db-migration:
        condition: service_completed_successfully
    environment:
      - REDIS_HOST=${REDIS_HOST_TOPUP:-redis-node-1}
      - REDIS_PORT=${REDIS_PORT_TOPUP:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD_TOPUP:-dragon_knight}
      - REDIS_CLUSTER_ENABLED=${REDIS_CLUSTER_ENABLED:-true}
      - REDIS_CLUSTER_ENDPOINTS=${REDIS_CLUSTER_ENDPOINTS:-redis-node-1:6379,redis-node-2:6379,redis-node-3:6379,redis-node-4:6379,redis-node-5:6379,redis-node-6:6379}
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GRPC_SERVER_PORT=${GRPC_TOPUP_PORT:-9008}
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB_NAME=example_mongo_payment_gateway

  transaction:
    build:
      context: ../..
      dockerfile: transaction/Dockerfile
    image: springboot-payment-gateway/transaction:latest
    container_name: transaction
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ../../chaos.yaml:/app/chaos.yaml:ro
    networks:
      - app_network
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis-cluster-init:
        condition: service_completed_successfully
      db-migration:
        condition: service_completed_successfully
    environment:
      - REDIS_HOST=${REDIS_HOST_TRANSACTION:-redis-node-1}
      - REDIS_PORT=${REDIS_PORT_TRANSACTION:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD_TRANSACTION:-dragon_knight}
      - REDIS_CLUSTER_ENABLED=${REDIS_CLUSTER_ENABLED:-true}
      - REDIS_CLUSTER_ENDPOINTS=${REDIS_CLUSTER_ENDPOINTS:-redis-node-1:6379,redis-node-2:6379,redis-node-3:6379,redis-node-4:6379,redis-node-5:6379,redis-node-6:6379}
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GRPC_SERVER_PORT=${GRPC_TRANSACTION_PORT:-9009}
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB_NAME=example_mongo_payment_gateway

  transfer:
    build:
      context: ../..
      dockerfile: transfer/Dockerfile
    image: springboot-payment-gateway/transfer:latest
    container_name: transfer
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
      - ../../chaos.yaml:/app/chaos.yaml:ro
    networks:
      - app_network
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis-cluster-init:
        condition: service_completed_successfully
      db-migration:
        condition: service_completed_successfully
    environment:
      - REDIS_HOST=${REDIS_HOST_TRANSFER:-redis-node-1}
      - REDIS_PORT=${REDIS_PORT_TRANSFER:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD_TRANSFER:-dragon_knight}
      - REDIS_CLUSTER_ENABLED=${REDIS_CLUSTER_ENABLED:-true}
